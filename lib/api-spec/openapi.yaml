openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Silent Witness API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: records
    description: Public witness record operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /records:
    get:
      operationId: listRecords
      tags: [records]
      summary: List public witness records
      description: Returns only records with publication_status = public_timestamped_record or exact_match_published.
      parameters:
        - name: country
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: evidenceType
          in: query
          schema:
            type: string
        - name: qualityLevel
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of public records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRecordsResponse"

    post:
      operationId: createRecord
      tags: [records]
      summary: Submit a public witness record
      description: >
        Submits a fingerprint for review. Records are set to pending_review and do not
        appear in the public registry until approved. The server sets serverReceivedAtUtc
        and publicationStatus — client values for these fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordBody"
      responses:
        "201":
          description: Record created and pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WitnessRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyRegisteredResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /records/{packageHash}:
    get:
      operationId: getRecord
      tags: [records]
      summary: Get a witness record by package hash
      description: Returns the record regardless of publication status (for verification and retraction).
      parameters:
        - name: packageHash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WitnessRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /records/stats:
    get:
      operationId: getRecordStats
      tags: [records]
      summary: Get aggregate stats about the public registry
      responses:
        "200":
          description: Registry statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AlreadyRegisteredResponse:
      type: object
      properties:
        status:
          type: string
          enum: [already_registered]
        error:
          type: string
        recordUrl:
          type: string
        serverReceivedAtUtc:
          type: string
      required:
        - status
        - error
        - recordUrl
        - serverReceivedAtUtc

    SafeDescriptor:
      type: object
      description: >
        Confirmed safe metadata about the evidence file. Only include fields that
        can be extracted with confidence. Omit uncertain fields entirely.
      properties:
        mediaType:
          type: ["string", "null"]
        fileSizeBucket:
          type: ["string", "null"]
        durationBucket:
          type: ["string", "null"]
          description: Only if confidently readable
        resolutionBucket:
          type: ["string", "null"]
          description: Only if confidently readable
        aspectRatioBucket:
          type: ["string", "null"]
          description: Only if confidently readable
        textWordCount:
          type: ["integer", "null"]
        language:
          type: ["string", "null"]
          description: "rough: arabic / english / mixed / unknown"
        gpsMetadataDetected:
          type: ["string", "null"]
          description: "'yes' only if GPS tags clearly detected; 'no' or omit otherwise"
        exifMetadataDetected:
          type: ["string", "null"]
          description: "'yes' only if EXIF metadata clearly detected"

    WitnessRecord:
      type: object
      description: >
        A public witness record. Exact SHA-256 matching only works if the later file
        is byte-for-byte identical. Files sent through messaging or social platforms
        may be compressed or re-encoded, causing exact hashes not to match.
      properties:
        id:
          type: integer
        packageHash:
          type: string
          description: SHA-256 of the canonical manifest JSON
        originalHash:
          type: ["string", "null"]
          description: SHA-256 of the original selected file, if provided
        safeCopyHash:
          type: ["string", "null"]
          description: SHA-256 of a safe export copy, if created
        eventType:
          type: string
        evidenceType:
          type: string
        country:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        safeDescriptor:
          $ref: "#/components/schemas/SafeDescriptor"
        qualityLevel:
          type: string
          enum: [A, B, C, D]
        publicationStatus:
          type: string
          enum:
            - pending_review
            - public_timestamped_record
            - rejected_for_public_registry
            - retracted_by_holder
            - exact_match_published
          description: >
            Approval workflow status. Only public_timestamped_record and
            exact_match_published appear in the public registry.
        status:
          type: string
          description: Record vocabulary status (timestamped_only_not_verified etc.)
        publicWarning:
          type: string
        createdAtLocal:
          type: string
          description: >
            Timestamp generated by the user's browser at fingerprint creation time.
            Comes from the user's device clock and is NOT independently verified.
        serverReceivedAtUtc:
          type: string
          description: >
            Timestamp set exclusively by the server when the public record was received.
            The client cannot set or override this value.
        approvedAtUtc:
          type: ["string", "null"]
          description: UTC time when a reviewer approved this record for the public registry.
        isDemo:
          type: boolean
      required:
        - id
        - packageHash
        - eventType
        - evidenceType
        - qualityLevel
        - publicationStatus
        - status
        - publicWarning
        - createdAtLocal
        - serverReceivedAtUtc
        - isDemo

    ListRecordsResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/WitnessRecord"
        total:
          type: integer
      required:
        - records
        - total

    CreateRecordBody:
      type: object
      description: >
        Fields accepted from the client. serverReceivedAtUtc and publicationStatus
        are NOT accepted — both are always set by the server.
        Exact SHA-256 matching requires the byte-for-byte identical file.
      properties:
        packageHash:
          type: string
          description: SHA-256 of the canonical manifest JSON
        originalHash:
          type: ["string", "null"]
          description: SHA-256 of the original selected file (optional)
        eventType:
          type: string
        evidenceType:
          type: string
        country:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        safeDescriptor:
          $ref: "#/components/schemas/SafeDescriptor"
        status:
          type: string
        qualityLevel:
          type: string
        publicWarning:
          type: string
        createdAtLocal:
          type: string
          description: >
            ISO-8601 timestamp from the user's device clock at fingerprint creation time.
            Stored as-is; not treated as authoritative.
        retractionTokenHash:
          type: ["string", "null"]
          description: >
            SHA-256 of the holder's retraction token. Only the hash is stored —
            the raw token stays in the holder's local proof package.
        honeypot:
          type: ["string", "null"]
      required:
        - packageHash
        - eventType
        - evidenceType
        - status
        - qualityLevel
        - publicWarning
        - createdAtLocal

    RegistryStats:
      type: object
      properties:
        total:
          type: integer
        byEventType:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
        byCountry:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
        byQualityLevel:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
        recentCount:
          type: integer
      required:
        - total
        - byEventType
        - byCountry
        - byQualityLevel
        - recentCount

    CountByKey:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
      required:
        - key
        - count
